<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deterministic Code Motion Starter · window.seek(t)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #090d16; overflow: hidden; display: grid; place-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    canvas { width: min(92vw, 960px); aspect-ratio: 16 / 9; border-radius: 12px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); border: 1px solid #1e293b; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const DURATION = 6.0;
    let manualSeek = false;

    function easeOutCubic(x) { return 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3); }

    window.seek = function seek(t) {
      manualSeek = true;
      renderFrame(t % DURATION);
    };

    function renderFrame(t) {
      ctx.fillStyle = "#090D16";
      ctx.fillRect(0, 0, 1920, 1080);

      // Subtle engineering grid
      ctx.strokeStyle = "rgba(56, 189, 248, 0.08)";
      ctx.lineWidth = 2;
      for (let x = 0; x <= 1920; x += 96) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
      for (let y = 0; y <= 1080; y += 96) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }

      const p1 = easeOutCubic(t / 1.4);
      const nodes = [
        { x: 380, y: 540, title: "HTML + Canvas", sub: "window.seek(t)" },
        { x: 960, y: 540, title: "Headless Chrome", sub: "SwiftShader 60fps" },
        { x: 1540, y: 540, title: "1080p MP4 / GIF", sub: "Zero Dropped Frames" }
      ];

      // Connecting beam + comet particle
      ctx.strokeStyle = "#1E293B";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(540, 540); ctx.lineTo(1380, 540); ctx.stroke();

      const beamX = 540 + ((t / DURATION) * 840);
      const grad = ctx.createLinearGradient(beamX - 140, 540, beamX, 540);
      grad.addColorStop(0, "rgba(16, 185, 129, 0)");
      grad.addColorStop(1, "#10B981");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(Math.max(540, beamX - 140), 540); ctx.lineTo(beamX, 540); ctx.stroke();

      nodes.forEach((n, i) => {
        const enter = easeOutCubic((t - i * 0.25) / 0.9);
        const yOff = (1 - enter) * 40;
        ctx.save();
        ctx.globalAlpha = enter;
        ctx.fillStyle = "#111827";
        ctx.strokeStyle = i === 2 ? "#10B981" : "#38BDF8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(n.x - 190, n.y - 110 + yOff, 380, 220, 18);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "700 38px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(n.title, n.x, n.y - 12 + yOff);

        ctx.fillStyle = "#94A3B8";
        ctx.font = "500 26px Menlo, monospace";
        ctx.fillText(n.sub, n.x, n.y + 44 + yOff);
        ctx.restore();
      });

      ctx.fillStyle = "#E2E8F0";
      ctx.globalAlpha = p1;
      ctx.font = "700 54px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("零 API 纯代码直出视频 · 确定性渲染骨架", 960, 210);
      ctx.globalAlpha = 1;
    }

    const start = performance.now();
    function loop(now) {
      if (!manualSeek) {
        renderFrame(((now - start) / 1000) % DURATION);
        requestAnimationFrame(loop);
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
